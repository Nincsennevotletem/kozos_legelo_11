<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapitány Levente Csaba</title>
</head>
<body>
    <form>
    <fieldset>
        <legend>Jaj</legend>
        <label for="tata">
            <input type="text" name="tata" id="laposfold" placeholder="Csak Írj valamit">
        </label>
    </fieldset>

    <fieldset>
        <legend>Válassz egy opciót:</legend>
        <label for="tamasi">Tamási</label><input type="radio" id="gomb" name="tamasi">
        <label for="tamasi">Csepel</label><input type="radio" id="gomba" name="tamasi">
        <label for="tamasi">Érd</label><input type="radio" id="gombabab" name="tamasi">
    </fieldset>

    <fieldset>
        <legend>Válassz annyit amenyit akarsz:</legend>
        <label for="nyak">Nyak</label> <input type="checkbox" id="egyedi" name="nyak">
        <label for="nyak">Paradicsom</label> <input type="checkbox" id="egyenibb" name="nyak">
        <label for="nyak">Párizs</label> <input type="checkbox" id="legegyedibb" name="nyak"> 
    </fieldset>

    <div>
        <input type="submit" value="Küldés">
    </div>
    </form>
    
</body>
</html>
